<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4d8f0">
<title>ミラクルスイーツチャレンジ</title>
<style>
:root{--pink:#f7b9df;--lavender:#c9b8f3;--blue:#b9def7;--cream:#fffaf0;--ink:#806b9b}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;padding:22px 16px;display:grid;place-items:center;overflow-x:hidden;position:relative;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 15% 15%,#fff 0%,transparent 28%),radial-gradient(ellipse at 85% 78%,#fff7fb 0%,transparent 30%),linear-gradient(145deg,#fce3f2 0%,#e8ddff 48%,#d9f0ff 100%)}
body:before,body:after{content:"☁";position:fixed;z-index:0;color:#fff9;font-size:clamp(100px,24vw,210px);pointer-events:none;filter:blur(.3px);text-shadow:0 8px 25px #bda9e522}
body:before{top:2%;left:-35px}body:after{right:-35px;bottom:1%}
.wrap{width:100%;max-width:620px;position:relative;z-index:1}
.card{position:relative;text-align:center;padding:35px 28px 28px;border:3px solid #fff;border-radius:42px;background:linear-gradient(155deg,#fffefaed,#fff7ffed);box-shadow:0 18px 48px #a995c533,inset 0 0 0 2px #f9d9ef;overflow:hidden}
.card:before{content:"✧ ｡ﾟ";position:absolute;top:12px;left:18px;color:#e8b7dc;font-size:20px;letter-spacing:8px}.card:after{content:"ﾟ｡ ✧";position:absolute;right:18px;bottom:10px;color:#c8b8ec;font-size:20px;letter-spacing:8px}
.kicker{margin:0 0 10px;font-size:12px;font-weight:900;letter-spacing:.25em;color:#b48bc9}
h1{margin:0;color:#b887c9;font-size:clamp(29px,7vw,43px);line-height:1.28;letter-spacing:.04em;text-shadow:2px 3px 0 #fbe1f1}
.sub{margin:11px 0 18px;font-weight:800;color:#9b87b3}
.candy-scene{height:132px;position:relative;margin:0 auto 12px;max-width:390px;display:flex;align-items:center;justify-content:center;gap:clamp(5px,2vw,15px);filter:drop-shadow(0 7px 5px #a98bc322)}
.candy-scene span{display:inline-flex;width:clamp(48px,13vw,76px);height:clamp(58px,15vw,88px);align-items:center;justify-content:center;animation:bob 3s ease-in-out infinite}
.candy-scene span:nth-child(2){animation-delay:.35s}.candy-scene span:nth-child(3){animation-delay:.7s}.candy-scene span:nth-child(4){animation-delay:1.05s}.candy-scene span:nth-child(5){animation-delay:1.4s}
.candy-scene svg{width:100%;height:100%;overflow:visible}
@keyframes bob{50%{transform:translateY(-9px) rotate(5deg)}}
.instructions{margin:10px 0 9px;text-align:left;font-weight:900;color:#8f7aa7}
input{width:100%;height:65px;border:2px solid #e9c8e7;border-radius:22px;background:#fffdfd;color:#806b9b;font-size:27px;letter-spacing:.2em;text-align:center;outline:none;box-shadow:inset 0 2px 7px #d9c9e522}
input::placeholder{color:#cbbbd5}input:focus{border-color:#c8a9e6;box-shadow:0 0 0 5px #eadcf766}
button{width:100%;min-height:68px;margin:18px 0 0;padding:12px 18px;border:2px solid #fff;border-radius:999px;background:linear-gradient(100deg,#f6c6e4,#e4d5fb,#c9e8fa,#f8d9ec);color:#80658f;font-family:inherit;font-size:clamp(18px,5vw,23px);font-weight:1000;letter-spacing:.04em;box-shadow:0 6px 0 #d6c1df,0 10px 24px #c9b5dc55;cursor:pointer;transition:transform .2s,filter .2s}
button:not(:disabled):active{transform:translateY(3px);box-shadow:0 3px 0 #d6c1df,0 7px 16px #c9b5dc44}
button:disabled{opacity:.72;cursor:default}
.note{margin:20px 0 0;font-size:12px;line-height:1.8;color:#a99ab7}
#result{display:none;margin-top:19px;padding:19px 13px;border:2px dashed #dfc5e8;border-radius:25px;background:linear-gradient(135deg,#fffafd,#f7f1ff)}
#result.show{display:block;animation:pop .4s ease-out}#resultTitle{margin:0 0 8px;color:#c184b8;font-size:27px}#resultText{margin:0;font-weight:800;line-height:1.7;color:#8b79a2}
#screenshotNote{display:none;margin:13px 0 0;color:#a47bbd;font-weight:1000}
.confetti{position:fixed;top:-50px;z-index:5;pointer-events:none;font-size:30px;animation:fall var(--dur) ease-in forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(720deg);opacity:.95}}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@media(max-width:420px){.card{padding:29px 19px 24px;border-radius:34px}.candy-scene{height:105px;gap:9px}.sub{font-size:13px}input{height:59px;font-size:24px}button{min-height:62px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap"><section class="card">
<p class="kicker">SWEET LUCKY CHALLENGE</p>
<h1>ミラクルスイーツ<br>チャレンジ</h1>
<p class="sub">お菓子の国で、幸運をつかもう！</p>
<div class="candy-scene" aria-hidden="true">
<span><svg viewBox="0 0 80 90"><rect x="13" y="22" width="54" height="48" rx="19" fill="#f9e0f2" stroke="#edb9dd" stroke-width="2"/><path d="M18 39 Q39 28 62 39" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="32" cy="48" r="2" fill="#b98cae"/><circle cx="49" cy="48" r="2" fill="#b98cae"/><path d="M35 56 Q40 61 45 56" fill="none" stroke="#d69abf" stroke-width="2" stroke-linecap="round"/></svg></span>
<span><svg viewBox="0 0 80 90"><path d="M40 48 L55 82" stroke="#d9b8a8" stroke-width="5" stroke-linecap="round"/><circle cx="36" cy="31" r="23" fill="#f9c7e4" stroke="#e9a9d2" stroke-width="2"/><circle cx="36" cy="31" r="15" fill="none" stroke="#fff5fb" stroke-width="5"/><path d="M22 18 Q35 8 48 20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg></span>
<span><svg viewBox="0 0 80 90"><path d="M17 56 Q8 54 10 44 Q12 34 24 35 Q28 18 44 22 Q57 23 59 37 Q72 37 71 49 Q70 58 59 58Z" fill="#e4dcff" stroke="#c8b9ef" stroke-width="2"/><path d="M23 43 Q40 32 57 43" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg></span>
<span><svg viewBox="0 0 80 90"><path d="M15 42 L65 42 L59 72 Q40 82 21 72Z" fill="#c9e6f7" stroke="#a8d0e9" stroke-width="2"/><path d="M14 43 Q40 34 66 43 L65 51 Q40 58 15 51Z" fill="#f7c6df"/><path d="M18 40 Q15 25 28 26 Q30 10 43 18 Q55 9 60 28 Q69 31 65 42Z" fill="#fff0f8" stroke="#edc4df" stroke-width="2"/><circle cx="40" cy="29" r="3" fill="#f3b2d3"/></svg></span>
<span><svg viewBox="0 0 80 90"><path d="M40 10 L47 31 L69 32 L52 46 L58 68 L40 55 L22 68 L28 46 L11 32 L33 31Z" fill="#f9e6a9" stroke="#eed58b" stroke-width="2" stroke-linejoin="round"/><path d="M40 18 L44 32" stroke="#fff7d9" stroke-width="4" stroke-linecap="round"/></svg></span>
</div>
<p class="instructions">くじ券の番号（4桁）</p>
<input id="ticketNumber" type="text" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="番号を入力" aria-label="抽選番号">
<button id="draw" type="button">🌈 ミラクル抽選スタート！</button>
<section id="result" aria-live="polite"><h2 id="resultTitle"></h2><p id="resultText"></p><p id="screenshotNote">📸 スクリーンショットを撮ってね！</p></section>
<p class="note">番号1つにつき抽選は1回限りです。使用済みの番号は、別のスマホからも再使用できません。</p>
</section></main>
<script>
const button=document.getElementById("draw"),input=document.getElementById("ticketNumber"),result=document.getElementById("result"),title=document.getElementById("resultTitle"),message=document.getElementById("resultText"),shot=document.getElementById("screenshotNote");
function candyBurst(){const sweets=["🍬","🍭","🍫","🍩","🍪","🧁","🍡","🍰","🍓","✨"];for(let i=0;i<42;i++){const el=document.createElement("span");el.className="confetti";el.textContent=sweets[Math.floor(Math.random()*sweets.length)];el.style.left=Math.random()*100+"vw";el.style.setProperty("--dx",(Math.random()-.5)*240+"px");el.style.setProperty("--dur",(2.1+Math.random()*2.2)+"s");el.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(el);setTimeout(()=>el.remove(),5000)}}
button.addEventListener("click",async()=>{const number=input.value.trim();if(!/^\d{4}$/.test(number)){alert("抽選番号を4桁の数字で入力してください！");input.focus();return}button.disabled=true;input.disabled=true;button.textContent="🍬 抽選中…";try{const response=await fetch("/api/draw",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({number})});const data=await response.json();if(!response.ok)throw new Error(data.error||"抽選できませんでした");title.textContent=data.win?"🎉 大当たり！景品GET！":"今回ははずれ…";message.textContent=data.win?"おめでとうございます！景品をお受け取りください！":"参加ありがとう！またの挑戦をお待ちしています。";shot.style.display=data.win?"block":"none";result.classList.add("show");if(data.win)candyBurst();button.textContent="抽選終了"}catch(e){alert(e.message);button.disabled=false;input.disabled=false;button.textContent="🌈 ミラクル抽選スタート！"}});
</script>
</body>
</html>
