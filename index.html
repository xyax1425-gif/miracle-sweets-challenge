<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4d8f0">
<title>ミラクルスイーツチャレンジ</title>
<style>
:root{--pink:#f6b9d6;--lavender:#cbb8ef;--blue:#b8e4f5;--cream:#fff9ed;--ink:#80678f}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;padding:24px 14px 38px;display:flex;align-items:center;justify-content:center;overflow-x:hidden;position:relative;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--ink);background:linear-gradient(180deg,#dff4ff 0%,#f7e8ff 34%,#ffe7ef 68%,#fff1d9 100%)}
body:before{content:"☁️　🍭　☁️　🍬　☁️　🍓　☁️";position:fixed;top:12px;left:0;width:100%;text-align:center;font-size:clamp(22px,5vw,42px);letter-spacing:8px;opacity:.68;pointer-events:none;white-space:nowrap}
body:after{content:"🍄　🍬　🧁　🍭　🍄　🍬　🧁";position:fixed;bottom:5px;left:0;width:100%;text-align:center;font-size:clamp(21px,5vw,38px);letter-spacing:7px;opacity:.7;pointer-events:none;white-space:nowrap}
.wrap{width:100%;max-width:650px;position:relative;z-index:1}
.card{position:relative;text-align:center;padding:28px 25px 30px;border:4px solid #fff;border-radius:48px;background:linear-gradient(160deg,#fffdf3ed 0%,#fff6f9e8 48%,#f6f1ffed 100%);box-shadow:0 15px 45px #9879b533,inset 0 0 0 2px #f6d9ed;overflow:hidden}
.card:before{content:"✧･ﾟ: *✧･ﾟ:*";position:absolute;top:13px;left:18px;color:#e9aaca;font-size:16px;letter-spacing:3px}.card:after{content:"*:･ﾟ✧*:･ﾟ✧";position:absolute;right:18px;bottom:10px;color:#bca5e5;font-size:16px;letter-spacing:3px}
.kicker{margin:0 0 7px;font-size:11px;font-weight:1000;letter-spacing:.3em;color:#ce8db8}
h1{margin:0;color:#b77bb0;font-size:clamp(31px,7vw,47px);line-height:1.22;letter-spacing:.04em;text-shadow:2px 3px 0 #ffe0ec,4px 5px 0 #fff}
.sub{margin:10px 0 4px;font-weight:900;color:#9277ac;font-size:15px}
.candy-scene{height:220px;position:relative;margin:2px auto 8px;max-width:510px;display:flex;align-items:center;justify-content:center;gap:clamp(5px,2vw,17px);filter:drop-shadow(0 9px 8px #a98bc333);border-radius:48% 48% 35% 35%;background:radial-gradient(ellipse at 50% 85%,#ffe1ed 0 25%,#f8e9ff88 55%,transparent 72%)}
.candy-scene:before{content:"☁️　✦　🍭　✧　☁️　✦　🍬";position:absolute;top:3px;left:0;right:0;color:#d8b5e5;font-size:clamp(16px,4vw,23px);letter-spacing:3px;pointer-events:none}
.candy-scene:after{content:"🍓　♡　🧁　♡　🍬";position:absolute;bottom:1px;left:0;right:0;font-size:clamp(17px,4vw,24px);letter-spacing:7px;pointer-events:none}
.candy-scene span{display:inline-flex;width:clamp(58px,15vw,96px);height:clamp(75px,20vw,124px);align-items:center;justify-content:center;animation:bob 3.6s ease-in-out infinite;position:relative;z-index:1}
.candy-scene span:nth-child(2){animation-delay:.35s}.candy-scene span:nth-child(3){animation-delay:.7s}.candy-scene span:nth-child(4){animation-delay:1.05s}.candy-scene span:nth-child(5){animation-delay:1.4s}
.candy-scene svg{width:100%;height:100%;overflow:visible}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
.instructions{margin:13px 0 9px;text-align:left;font-weight:1000;color:#9278a9}
input{width:100%;height:65px;border:3px solid #f2c9e1;border-radius:25px;background:#fff;color:#866d9b;font-size:27px;letter-spacing:.2em;text-align:center;outline:none;box-shadow:inset 0 2px 8px #d9c9e522,0 5px 15px #ddcbe522}
input::placeholder{color:#d5bdd5}input:focus{border-color:#d5a9df;box-shadow:0 0 0 5px #eadcf766}
button{position:relative;isolation:isolate;overflow:visible;width:100%;min-height:82px;margin:20px 0 0;padding:15px 24px;border:4px solid #fff;border-radius:50% / 58%;background:linear-gradient(100deg,#ffcae4 0%,#e6caff 34%,#c5eaff 68%,#fff0b9 100%);color:#805f9b;font-family:inherit;font-size:clamp(20px,5vw,26px);font-weight:1000;letter-spacing:.08em;text-shadow:0 1px #fff;box-shadow:0 7px 0 #c5a8d9,0 13px 25px #c9b5dc66,inset 0 3px 9px #fff;cursor:pointer;animation:buttonGlow 2.4s ease-in-out infinite}
button:before,button:after{content:"✦";position:absolute;color:#fff;font-size:25px;text-shadow:0 0 9px #fff,0 0 14px #e5a7ed;pointer-events:none}
button:before{left:9%;top:9px}button:after{right:9%;bottom:5px}
button span{position:relative;z-index:1;display:block}
button:not(:disabled):active{transform:translateY(3px);box-shadow:0 3px 0 #c5a8d9,0 7px 16px #c9b5dc44}
button:disabled{opacity:.72;cursor:default;animation:none}
@keyframes buttonGlow{50%{filter:brightness(1.07) drop-shadow(0 0 10px #fff2b9)}}
.note{margin:18px 0 0;font-size:12px;line-height:1.9;color:#a18cae}
#result{display:none;margin-top:20px;padding:20px 14px;border:3px dashed #e6bddd;border-radius:30px;background:linear-gradient(135deg,#fffafd,#f7f1ff)}
#result.show{display:block;animation:pop .4s ease-out}#resultTitle{margin:0 0 8px;color:#c16ca9;font-size:28px}#resultText{margin:0;font-weight:900;line-height:1.7;color:#806c9b}
#screenshotNote{display:none;margin:13px 0 0;color:#a47bbd;font-weight:1000}
.confetti{position:fixed;top:-50px;z-index:5;pointer-events:none;font-size:30px;animation:fall var(--dur) ease-in forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(720deg);opacity:.95}}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@media(max-width:420px){body{padding:34px 10px 42px}.card{padding:26px 17px 27px;border-radius:39px}.candy-scene{height:178px;gap:3px}.candy-scene span{width:clamp(49px,15vw,68px);height:clamp(66px,19vw,91px)}.sub{font-size:13px}input{height:60px;font-size:24px}button{min-height:74px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap"><section class="card">
<p class="kicker">SWEET LUCKY CHALLENGE</p>
<h1>ミラクルスイーツ<br>チャレンジ</h1>
<p class="sub">お菓子の国で、幸運をつかもう！</p>
<div class="candy-scene" aria-hidden="true">
<span><svg viewBox="0 0 100 100"><path d="M22 39 Q8 3 31 16 L43 34 M57 34 Q77 2 83 22 L72 48" fill="#fff4fa" stroke="#e8b7d6" stroke-width="4" stroke-linejoin="round"/><ellipse cx="50" cy="58" rx="35" ry="31" fill="#fff9fc" stroke="#e8b7d6" stroke-width="3"/><ellipse cx="37" cy="57" rx="3" ry="4" fill="#987a92"/><ellipse cx="63" cy="57" rx="3" ry="4" fill="#987a92"/><ellipse cx="26" cy="68" rx="7" ry="4" fill="#ffc5d9"/><ellipse cx="74" cy="68" rx="7" ry="4" fill="#ffc5d9"/><path d="M46 66 Q50 71 54 66" fill="none" stroke="#c88eae" stroke-width="2.5" stroke-linecap="round"/></svg></span>
<span><svg viewBox="0 0 100 100"><circle cx="50" cy="53" r="34" fill="#e9c59f" stroke="#c99d7d" stroke-width="3"/><circle cx="17" cy="30" r="15" fill="#e9c59f" stroke="#c99d7d" stroke-width="3"/><circle cx="83" cy="30" r="15" fill="#e9c59f" stroke="#c99d7d" stroke-width="3"/><circle cx="17" cy="30" r="7" fill="#f7d7dc"/><circle cx="83" cy="30" r="7" fill="#f7d7dc"/><ellipse cx="50" cy="64" rx="18" ry="13" fill="#fff1e4"/><circle cx="39" cy="51" r="3" fill="#765d53"/><circle cx="61" cy="51" r="3" fill="#765d53"/><ellipse cx="50" cy="61" rx="4" ry="3" fill="#b77e78"/><path d="M50 64 Q45 71 40 66 M50 64 Q55 71 60 66" fill="none" stroke="#9b716a" stroke-width="2" stroke-linecap="round"/></svg></span>
<span><svg viewBox="0 0 100 100"><path d="M19 43 L16 16 Q16 10 23 14 L43 31 Q50 28 57 31 L77 14 Q84 10 84 18 L81 47" fill="#f7d7b6" stroke="#d9a987" stroke-width="3" stroke-linejoin="round"/><path d="M19 43 Q50 20 81 43 L78 70 Q70 88 50 88 Q29 88 22 70Z" fill="#fff0df" stroke="#d9a987" stroke-width="3"/><path d="M25 42 L24 25 L42 38 M75 42 L76 25 L58 38" fill="#f5b9c9"/><circle cx="39" cy="57" r="3" fill="#856b61"/><circle cx="61" cy="57" r="3" fill="#856b61"/><path d="M46 65 Q50 69 54 65" fill="none" stroke="#bd8d86" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="29" cy="67" rx="7" ry="4" fill="#ffc5c9"/><ellipse cx="71" cy="67" rx="7" ry="4" fill="#ffc5c9"/></svg></span>
<span><svg viewBox="0 0 100 100"><circle cx="50" cy="51" r="34" fill="#f7c8df" stroke="#e8a9cb" stroke-width="3"/><circle cx="50" cy="51" r="15" fill="#fff9fc" stroke="#e8a9cb" stroke-width="3"/><path d="M23 28 Q35 17 45 21 M57 21 Q70 17 78 29" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="30" cy="57" r="4" fill="#fff"/><circle cx="70" cy="57" r="4" fill="#fff"/></svg></span>
<span><svg viewBox="0 0 100 100"><path d="M19 48 Q15 29 32 31 Q37 13 52 25 Q67 14 73 33 Q88 31 84 49Z" fill="#fff2f8" stroke="#e7bdd8" stroke-width="3"/><path d="M22 48 L78 48 L72 82 Q50 91 28 82Z" fill="#bfe1f3" stroke="#9bc9e2" stroke-width="3"/><path d="M20 49 Q50 40 80 49" fill="none" stroke="#f5b8d8" stroke-width="9"/><circle cx="50" cy="35" r="4" fill="#f3b2d3"/><circle cx="36" cy="39" r="2.5" fill="#f3b2d3"/><circle cx="65" cy="39" r="2.5" fill="#f3b2d3"/></svg></span>
</div>
<p class="instructions">くじ券の番号（4桁）</p>
<input id="ticketNumber" type="text" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="番号を入力" aria-label="抽選番号">
<button id="draw" type="button"><span>ミラクルスタート</span></button>
<section id="result" aria-live="polite"><h2 id="resultTitle"></h2><p id="resultText"></p><p id="screenshotNote">📸 スクリーンショットを撮ってね！</p></section>
<p class="note">番号1つにつき抽選は1回限りです。使用済みの番号は、別のスマホからも再使用できません。</p>
</section></main>
<script>
const button=document.getElementById("draw"),input=document.getElementById("ticketNumber"),result=document.getElementById("result"),title=document.getElementById("resultTitle"),message=document.getElementById("resultText"),shot=document.getElementById("screenshotNote");
function candyBurst(){const sweets=["🐰","🐻","🐱","🍬","🍭","🍩","🍪","🧁","🍓","✨"];for(let i=0;i<42;i++){const el=document.createElement("span");el.className="confetti";el.textContent=sweets[Math.floor(Math.random()*sweets.length)];el.style.left=Math.random()*100+"vw";el.style.setProperty("--dx",(Math.random()-.5)*240+"px");el.style.setProperty("--dur",(2.1+Math.random()*2.2)+"s");el.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(el);setTimeout(()=>el.remove(),5000)}}
button.addEventListener("click",async()=>{const number=input.value.trim();if(!/^\d{4}$/.test(number)){alert("抽選番号を4桁の数字で入力してください！");input.focus();return}button.disabled=true;input.disabled=true;button.querySelector("span").textContent="抽選中…";try{const response=await fetch("/api/draw",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({number})});const data=await response.json();if(!response.ok)throw new Error(data.error||"抽選できませんでした");title.textContent=data.win?"🎉 大当たり！景品GET！":"今回ははずれ…";message.textContent=data.win?"おめでとうございます！景品をお受け取りください！":"参加ありがとう！またの挑戦をお待ちしています。";shot.style.display=data.win?"block":"none";result.classList.add("show");if(data.win)candyBurst();button.querySelector("span").textContent="抽選終了"}catch(e){alert(e.message);button.disabled=false;input.disabled=false;button.querySelector("span").textContent="ミラクルスタート"}});
</script>
</body>
</html>
