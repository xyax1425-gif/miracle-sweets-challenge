<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b2b">
<title>ハイキュー!! ミラクルチャレンジ</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:22px 14px;display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#30465b,#101b2b 62%,#080f19);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#fff;overflow-x:hidden}.wrap{width:100%;max-width:590px}.card{position:relative;overflow:hidden;text-align:center;padding:30px 23px 27px;border:2px solid #f2a900;border-radius:25px;background:linear-gradient(155deg,#172b40,#0d1725 75%);box-shadow:0 0 0 6px #f2a90020,0 20px 60px #0009}.card:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 24px,#ffffff08 25px 27px);pointer-events:none}.top{position:relative;color:#ffbd28;font-size:12px;font-weight:1000;letter-spacing:.32em}.title{position:relative;margin:8px 0 4px;font-size:clamp(32px,8vw,49px);font-weight:1000;line-height:1.12;letter-spacing:.04em;color:#fff;text-shadow:3px 4px 0 #e87517}.subtitle{position:relative;color:#b9d9ec;font-size:14px;font-weight:800;margin:12px 0 0}.court{position:relative;height:215px;margin:14px auto 12px;max-width:440px;display:grid;place-items:center;background:linear-gradient(180deg,#172f43aa,#172f4300);border-radius:20px}.court:before{content:"";position:absolute;inset:25px 12px 14px;border:3px solid #f4b32a;border-bottom-width:5px;transform:perspective(240px) rotateX(12deg);opacity:.65}.ball{position:relative;width:clamp(125px,35vw,175px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 27%,#fff 0 5%,#f9f4e7 23%,#e7d9b9 65%,#b9a47c 100%);box-shadow:inset -12px -13px 18px #46351f55,0 16px 28px #0008;animation:float 3s ease-in-out infinite}.ball:before,.ball:after{content:"";position:absolute;inset:0;border:8px solid transparent;border-left-color:#e87517;border-right-color:#e87517;border-radius:50%;transform:rotate(38deg)}.ball:after{border-left-color:transparent;border-right-color:transparent;border-top-color:#e87517;border-bottom-color:#e87517;transform:rotate(-38deg)}.spark{position:absolute;color:#ffbd28;font-size:25px;animation:blink 1.5s ease-in-out infinite}.s1{left:10%;top:24%}.s2{right:9%;top:30%;animation-delay:.5s}.s3{left:19%;bottom:12%;animation-delay:.9s}.s4{right:17%;bottom:13%;animation-delay:.3s}@keyframes float{50%{transform:translateY(-10px) rotate(8deg)}}@keyframes blink{50%{opacity:.3;transform:scale(.7)}}.label{position:relative;text-align:left;margin:12px 0 8px;font-weight:900;color:#ffd36b}input{position:relative;width:100%;height:62px;border:2px solid #e7a52c;border-radius:12px;background:#fff;color:#152538;text-align:center;font-size:28px;font-weight:900;letter-spacing:.25em;outline:none}input::placeholder{color:#a8b4c0;font-size:17px;letter-spacing:.05em}button{position:relative;width:100%;height:67px;margin-top:17px;border:0;border-radius:13px;background:linear-gradient(180deg,#ffc943,#ed8418);color:#172234;font-size:22px;font-weight:1000;letter-spacing:.08em;box-shadow:0 6px 0 #a64c0b,0 12px 20px #0005;cursor:pointer}button:active{transform:translateY(4px);box-shadow:0 2px 0 #a64c0b}button:disabled{opacity:.7;cursor:default}.note{position:relative;margin:17px 0 0;color:#b4c4d2;font-size:11px;line-height:1.8}#result{display:none;position:relative;margin-top:19px;padding:20px 12px;border:2px solid #ffbf39;border-radius:16px;background:#fff;color:#18283a}#result.show{display:block;animation:pop .35s ease-out}#resultTitle{margin:0 0 8px;color:#e66f12;font-size:28px}#resultText{margin:0;font-weight:900;line-height:1.7}#shot{display:none;color:#cf5d0a;font-weight:1000;margin:12px 0 0}@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}@media(max-width:400px){.card{padding:26px 17px 23px}.court{height:185px}.title{font-size:34px}}
</style>
</head>
<body><main class="wrap"><section class="card">
<div class="top">ONE CHANCE · ONE DREAM</div>
<h1 class="title">ハイキュー!!<br>ミラクルチャレンジ</h1>
<p class="subtitle">最後まであきらめるな。運命の一球をつかめ！</p>
<div class="court" aria-hidden="true"><span class="spark s1">✦</span><span class="spark s2">★</span><span class="spark s3">✧</span><span class="spark s4">✦</span><div class="ball"></div></div>
<p class="label">くじ券の番号（4桁）</p>
<input id="ticket" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="番号を入力" aria-label="抽選番号">
<button id="draw" type="button">ミラクルスタート！</button>
<section id="result" aria-live="polite"><h2 id="resultTitle"></h2><p id="resultText"></p><p id="shot">📸 スクリーンショットを撮ってね！</p></section>
<p class="note">抽選は1つの番号につき1回限りです。使用済みの番号は、別のスマホからも再使用できません。</p>
</section></main>
<script>
const input=document.getElementById("ticket"),button=document.getElementById("draw"),result=document.getElementById("result"),title=document.getElementById("resultTitle"),msg=document.getElementById("resultText"),shot=document.getElementById("shot");
button.addEventListener("click",async()=>{const number=input.value.trim();if(!/^\d{4}$/.test(number)){alert("4桁の番号を入力してください！");input.focus();return}button.disabled=true;input.disabled=true;button.textContent="運命の一球…";try{const r=await fetch("/api/draw",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({number})});const data=await r.json();if(!r.ok)throw new Error(data.error||"抽選できませんでした");title.textContent=data.win?"🏆 大当たり！！":"今回は残念…";msg.textContent=data.win?"おめでとう！景品GET！スタッフに画面を見せてね。":"参加ありがとう！最後までナイスチャレンジ！";shot.style.display=data.win?"block":"none";result.classList.add("show");button.textContent="抽選終了"}catch(e){alert(e.message);button.disabled=false;input.disabled=false;button.textContent="ミラクルスタート！"}});
</script></body></html>
