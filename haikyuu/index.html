<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b2b">
<title>ハイキュー!! ミラクルチャレンジ</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;min-height:100svh;padding:24px 14px;display:grid;place-items:center;overflow-x:hidden;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#fff;background:linear-gradient(180deg,#101a29 0%,#17283a 55%,#0b1420 100%);position:relative}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background:repeating-linear-gradient(90deg,transparent 0 48px,#8fb4ca22 49px 51px),linear-gradient(180deg,transparent 0 68%,#e98a2022 68.2% 68.6%,transparent 69%)}
body:after{content:"";position:fixed;left:-20%;right:-20%;bottom:-24vh;height:55vh;border:3px solid #f4a51c55;border-radius:50% 50% 0 0;transform:perspective(500px) rotateX(58deg);pointer-events:none}
.wrap{width:100%;max-width:590px;position:relative;z-index:1}
.card{position:relative;overflow:hidden;text-align:center;padding:30px 23px 27px;border:1px solid #ffb52d;border-radius:8px;background:linear-gradient(145deg,#1d3449f5,#101c2bf7 72%);box-shadow:0 0 0 5px #f4a51c18,0 24px 70px #000b}
.card:before{content:"";position:absolute;inset:0 0 auto;height:8px;background:linear-gradient(90deg,#f28b18 0 22%,#fff 22% 24%,#172b40 24% 76%,#fff 76% 78%,#f28b18 78%)}
.card:after{content:"";position:absolute;right:-48px;top:65px;width:150px;height:150px;border:2px solid #f5a62330;border-radius:50%;box-shadow:0 0 0 14px #f5a6230c,0 0 0 30px #f5a62308;pointer-events:none}
.top{position:relative;color:#ffc04c;font-size:11px;font-weight:1000;letter-spacing:.38em}
.title{position:relative;margin:12px 0 4px;font-size:clamp(32px,8vw,49px);font-weight:1000;line-height:1.12;letter-spacing:.035em;color:#fff;text-shadow:3px 4px 0 #e87517}
.subtitle{position:relative;color:#c4d7e6;font-size:14px;font-weight:800;margin:12px 0 0}
.court{position:relative;height:215px;margin:14px auto 12px;max-width:440px;display:grid;place-items:center;background:linear-gradient(180deg,#24445c99,#172f4300);border-radius:5px;isolation:isolate}
.court:before{content:"";position:absolute;inset:16px 8px 12px;border:2px solid #f4b32a;opacity:.55;transform:perspective(240px) rotateX(12deg)}
.court:after{content:"";position:absolute;left:50%;top:20px;bottom:14px;border-left:2px solid #f4b32a66;transform:perspective(240px) rotateX(12deg)}
.ball{position:relative;width:clamp(125px,35vw,175px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 27%,#fff 0 5%,#f9f4e7 23%,#e7d9b9 65%,#b9a47c 100%);box-shadow:inset -12px -13px 18px #46351f55,0 16px 28px #0008;animation:float 3s ease-in-out infinite;z-index:1}
.ball:before,.ball:after{content:"";position:absolute;inset:0;border:8px solid transparent;border-left-color:#e87517;border-right-color:#e87517;border-radius:50%;transform:rotate(38deg)}
.ball:after{border-left-color:transparent;border-right-color:transparent;border-top-color:#e87517;border-bottom-color:#e87517;transform:rotate(-38deg)}
.spark{position:absolute;color:#ffbd28;font-size:25px;animation:blink 1.5s ease-in-out infinite;z-index:2}
.s1{left:10%;top:24%}.s2{right:9%;top:30%;animation-delay:.5s}.s3{left:19%;bottom:12%;animation-delay:.9s}.s4{right:17%;bottom:13%;animation-delay:.3s}
@keyframes float{50%{transform:translateY(-10px) rotate(8deg)}}@keyframes blink{50%{opacity:.3;transform:scale(.7)}}
.label{position:relative;text-align:left;margin:12px 0 8px;font-weight:900;color:#ffd36b}
input{position:relative;width:100%;height:62px;border:2px solid #f0aa2b;border-radius:5px;background:#f8fafc;color:#152538;text-align:center;font-size:28px;font-weight:900;letter-spacing:.25em;outline:none;box-shadow:inset 0 2px 5px #0002}
input:focus{border-color:#fff;box-shadow:0 0 0 4px #f0aa2b55}
input::placeholder{color:#a8b4c0;font-size:17px;letter-spacing:.05em}
button{position:relative;width:100%;height:67px;margin-top:17px;border:0;border-radius:5px;background:linear-gradient(180deg,#ffd45c,#f18a18);color:#172234;font-size:22px;font-weight:1000;letter-spacing:.08em;box-shadow:0 6px 0 #a64c0b,0 12px 20px #0005;cursor:pointer;transition:filter .15s,transform .15s}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #a64c0b}button:disabled{opacity:.7;cursor:default}
.note{position:relative;margin:17px 0 0;color:#b4c4d2;font-size:11px;line-height:1.8}
#result{display:none;position:relative;margin-top:19px;padding:20px 12px;border:2px solid #ffbf39;border-radius:6px;background:linear-gradient(135deg,#fff,#fff4d8);color:#18283a}
#result.show{display:block;animation:pop .35s ease-out}
#resultTitle{margin:0 0 8px;color:#e66f12;font-size:28px}
#resultText{margin:0;font-weight:900;line-height:1.7}
#shot{display:none;color:#cf5d0a;font-weight:1000;margin:12px 0 0}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@media(max-width:400px){.card{padding:26px 17px 23px}.court{height:185px}.title{font-size:34px}}
</style>
</head>
<body><main class="wrap"><section class="card">
<div class="top">ONE CHANCE · ONE DREAM</div>
<h1 class="title">ハイキュー!!<br>ミラクルチャレンジ</h1>
<p class="subtitle">最後まであきらめるな。運命の一球をつかめ！</p>
<div class="court" aria-hidden="true"><span class="spark s1">✦</span><span class="spark s2">★</span><span class="spark s3">✧</span><span class="spark s4">✦</span><div class="ball"></div></div>
<p class="label">くじ券の番号（4桁）</p>
<input id="ticket" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="番号を入力" aria-label="抽選番号">
<button id="draw" type="button">ミラクルスタート！</button>
<section id="result" aria-live="polite"><h2 id="resultTitle"></h2><p id="resultText"></p><p id="shot">📸 スクリーンショットを撮ってね！</p></section>
<p class="note">抽選は1つの番号につき1回限りです。使用済みの番号は、別のスマホからも再使用できません。</p>
</section></main>
<script>
const input=document.getElementById("ticket"),button=document.getElementById("draw"),result=document.getElementById("result"),title=document.getElementById("resultTitle"),msg=document.getElementById("resultText"),shot=document.getElementById("shot");
button.addEventListener("click",async()=>{const number=input.value.trim();if(!/^\d{4}$/.test(number)){alert("4桁の番号を入力してください！");input.focus();return}button.disabled=true;input.disabled=true;button.textContent="運命の一球…";try{const r=await fetch("/api/draw",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({number})});const data=await r.json();if(!r.ok)throw new Error(data.error||"抽選できませんでした");title.textContent=data.win?"🏆 大当たり！！":"今回は残念…";msg.textContent=data.win?"おめでとう！景品GET！スタッフに画面を見せてね。":"参加ありがとう！最後までナイスチャレンジ！";shot.style.display=data.win?"block":"none";result.classList.add("show");button.textContent="抽選終了"}catch(e){alert(e.message);button.disabled=false;input.disabled=false;button.textContent="ミラクルスタート！"}});
</script></body></html>
